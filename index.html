<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pint Pins: Brewery Mapper</title>
  <meta name="description" content="Log the breweries you've visited and see them on a map of the US.">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1f6fdc">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Pint Pins">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <aside id="panel">
    <header class="panel-header">
      <h1><img src="icons/icon.svg" alt="" class="logo">Pint Pins:<span class="subtitle"> Brewery Mapper</span></h1>
    </header>

    <section id="stats" class="stats" aria-label="Stats"></section>

    <section class="add">
      <label for="search" class="section-label">Log a brewery</label>
      <input id="search" type="search" placeholder="Search breweries by name…" autocomplete="off">
      <p id="search-status" class="hint" aria-live="polite"></p>
      <ul id="results" class="results"></ul>
    </section>

    <section class="mine">
      <div class="mine-header">
        <h2 class="section-label">My breweries</h2>
        <input id="filter" type="search" placeholder="Filter" aria-label="Filter my breweries">
      </div>
      <ul id="list" class="list"></ul>
    </section>
  </aside>

  <main id="map" aria-label="Map of breweries"></main>

  <dialog id="detail" class="sheet"></dialog>

  <dialog id="visit-dialog" class="sheet">
    <form id="visit-form" method="dialog">
      <header class="sheet-header">
        <div>
          <h2 id="visit-title">Log a visit</h2>
          <p id="visit-subtitle" class="muted"></p>
        </div>
        <button type="button" class="icon-btn" data-close aria-label="Close">✕</button>
      </header>

      <label class="field">
        <span>Date</span>
        <input type="date" name="date" required>
      </label>

      <fieldset class="field">
        <legend>Rating</legend>
        <div class="stars-input">
          <input type="radio" name="rating" id="r5" value="5"><label for="r5" title="5 stars">★</label>
          <input type="radio" name="rating" id="r4" value="4"><label for="r4" title="4 stars">★</label>
          <input type="radio" name="rating" id="r3" value="3"><label for="r3" title="3 stars">★</label>
          <input type="radio" name="rating" id="r2" value="2"><label for="r2" title="2 stars">★</label>
          <input type="radio" name="rating" id="r1" value="1"><label for="r1" title="1 star">★</label>
        </div>
        <button type="button" id="clear-rating" class="link-btn">No rating</button>
      </fieldset>

      <label class="field">
        <span>Notes / beers tried</span>
        <textarea name="notes" rows="4" placeholder="Hazy IPA was great, try the stout next time…"></textarea>
      </label>

      <div class="field">
        <span>Photos</span>
        <div id="photo-previews" class="photo-grid"></div>
        <label class="btn secondary file-btn">
          Add photos
          <input id="photo-input" type="file" accept="image/*" multiple hidden>
        </label>
      </div>

      <p id="visit-error" class="error" aria-live="polite"></p>

      <footer class="sheet-footer">
        <button type="button" class="btn secondary" data-close>Cancel</button>
        <button type="submit" class="btn primary" id="visit-save">Save visit</button>
      </footer>
    </form>
  </dialog>

  <dialog id="manual-dialog" class="sheet">
    <form id="manual-form">
      <header class="sheet-header">
        <div>
          <h2>Add a brewery</h2>
          <p class="muted">We’ll find it on the map from the address.</p>
        </div>
        <button type="button" class="icon-btn" data-close aria-label="Close">✕</button>
      </header>

      <label class="field">
        <span>Brewery name</span>
        <input type="text" name="name" required autocomplete="off">
      </label>
      <label class="field">
        <span>Street address <em class="optional">(recommended for an exact pin)</em></span>
        <input type="text" name="street" placeholder="804 Winston St" autocomplete="off">
      </label>
      <div class="field-row">
        <label class="field">
          <span>City</span>
          <input type="text" name="city" required autocomplete="off">
        </label>
        <label class="field">
          <span>State</span>
          <select name="state" required>
            <option value="">Choose…</option>
            <option>Alabama</option>
            <option>Alaska</option>
            <option>Arizona</option>
            <option>Arkansas</option>
            <option>California</option>
            <option>Colorado</option>
            <option>Connecticut</option>
            <option>Delaware</option>
            <option>District of Columbia</option>
            <option>Florida</option>
            <option>Georgia</option>
            <option>Hawaii</option>
            <option>Idaho</option>
            <option>Illinois</option>
            <option>Indiana</option>
            <option>Iowa</option>
            <option>Kansas</option>
            <option>Kentucky</option>
            <option>Louisiana</option>
            <option>Maine</option>
            <option>Maryland</option>
            <option>Massachusetts</option>
            <option>Michigan</option>
            <option>Minnesota</option>
            <option>Mississippi</option>
            <option>Missouri</option>
            <option>Montana</option>
            <option>Nebraska</option>
            <option>Nevada</option>
            <option>New Hampshire</option>
            <option>New Jersey</option>
            <option>New Mexico</option>
            <option>New York</option>
            <option>North Carolina</option>
            <option>North Dakota</option>
            <option>Ohio</option>
            <option>Oklahoma</option>
            <option>Oregon</option>
            <option>Pennsylvania</option>
            <option>Puerto Rico</option>
            <option>Rhode Island</option>
            <option>South Carolina</option>
            <option>South Dakota</option>
            <option>Tennessee</option>
            <option>Texas</option>
            <option>Utah</option>
            <option>Vermont</option>
            <option>Virginia</option>
            <option>Washington</option>
            <option>West Virginia</option>
            <option>Wisconsin</option>
            <option>Wyoming</option>
          </select>
        </label>
      </div>
      <label class="field field-zip">
        <span>ZIP <em class="optional">(optional)</em></span>
        <input type="text" name="zip" inputmode="numeric" maxlength="10" autocomplete="off">
      </label>

      <footer class="sheet-footer">
        <button type="button" class="btn secondary" data-close>Cancel</button>
        <button type="submit" class="btn primary">Next: log a visit</button>
      </footer>
    </form>
  </dialog>

  <dialog id="photo-viewer" class="photo-viewer">
    <img alt="">
    <button type="button" class="icon-btn" data-close aria-label="Close">✕</button>
  </dialog>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
